# The checks on Linux: rustfmt, clippy, build, test, cross, sanitizer, valgrind and coverage. The
# checks on macOS are in `macos.yml`, the checks on Windows in `windows.yml`, and Miri in
# `miri.yml`.
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  workflow_dispatch:
  schedule: 
    - cron: "0 1 1 * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  nightly: nightly
  stable: stable

jobs:
  # Check formatting
  rustfmt:
    name: rustfmt
    strategy:
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Check formatting
      run: cargo fmt --all -- --check


  # Apply clippy lints
  clippy:
    name: clippy
    strategy:
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      run: cargo hack clippy --each-feature

  # Run tests on some extra platforms
  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          # - mips64-unknown-linux-gnuabi64
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
          - thumbv7em-none-eabihf
          - thumbv6m-none-eabi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build --target ${{ matrix.target }}
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          case "${{ matrix.target }}" in
            # A bare-metal target has no `std`, so it builds without the default `std` feature,
            # and with `alloc` it builds the heap storages.
            *-none-*)
              cargo build --target ${{ matrix.target }} --no-default-features
              cargo build --target ${{ matrix.target }} --no-default-features --features serde
              cargo build --target ${{ matrix.target }} --no-default-features --features alloc
              cargo build --target ${{ matrix.target }} --no-default-features --features alloc,serde
              ;;
            *)
              cargo build --target ${{ matrix.target }}
              ;;
          esac

  build:
    name: build
    strategy:
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Cache ~/.cargo
      uses: actions/cache@v6
      with:
        path: ~/.cargo
        key: ${{ runner.os }}-coverage-dotcargo
    # A tier turns on its own feature, the feature of an optional dependency turns on no tier of
    # this crate, and a build without `std` has no `std` feature of any crate on. `cargo tree`
    # lists the packages of a build of the target, this crate first, each with the features that it
    # has on, without the dev-dependencies, the build scripts and the proc macros of the host, and a
    # feature is matched as a whole item of a list.
    - name: Check what each feature turns on
      shell: bash
      run: |
        packages() {
          cargo tree -e no-dev,no-build,no-proc-macro --prefix none -f '{p} [{f}]' \
            --no-default-features --features "$1"
        }
        listing() {
          grep -E "\[([^]]*,)?($1)(,[^]]*)?\]"
        }
        for tier in std alloc; do
          lines=$(packages "$tier")
          if ! listing "$tier" <<<"${lines%%$'\n'*}"; then
            echo "::error::--features $tier does not turn on $tier of this crate"
            exit 1
          fi
        done
        for feature in serde arbitrary proptest quickcheck; do
          lines=$(packages "$feature")
          if listing 'std|alloc' <<<"${lines%%$'\n'*}"; then
            echo "::error::the feature $feature turns on a tier of this crate"
            exit 1
          fi
        done
        for features in '' alloc serde alloc,serde; do
          lines=$(packages "$features")
          if listing std <<<"$lines"; then
            echo "::error::a build with the features '$features' has a std feature on"
            exit 1
          fi
        done
    - name: Run build
      run: cargo hack build --feature-powerset --depth 2
  
  test:
    name: test
    strategy:
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Cache ~/.cargo
      uses: actions/cache@v6
      with:
        path: ~/.cargo
        key: ${{ runner.os }}-coverage-dotcargo
    - name: Run test
      run: cargo hack test --each-feature
    - name: Run the arithmetic tests without overflow checks and the Full tier of the integer serde tests
      run: cargo test --release --lib --features serde integer::arithmetic
  
  sanitizer:
    name: sanitizer-${{ matrix.sanitizer }}
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - address
          - leak
          - memory
          - thread
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-sanitizer-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sanitizer-registry-
      - name: Install Rust
        run: rustup update $nightly && rustup default $nightly
      - name: Install rust-src
        if: matrix.sanitizer == 'memory' || matrix.sanitizer == 'thread'
        run: rustup component add rust-src
      - name: ${{ matrix.sanitizer }} sanitizer (Linux)
        run: ci/sanitizer.sh ${{ matrix.sanitizer }}

  # valgrind
  valgrind:
    name: valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-latest-valgrind-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-latest-valgrind-

      - name: Install Rust ${{ env.stable }}
        uses: actions-rs/toolchain@v1
        with:
            toolchain: ${{ env.stable }}
            override: true
      - name: Install Valgrind
        run: |
          sudo apt-get update -y
          sudo apt-get install -y valgrind
      # Compile tests
      # - name: cargo build foo
      #   run: cargo build --bin foo
      #   working-directory: integration

      # Run with valgrind
      # - name: Run valgrind foo
      #   run: valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=all ./target/debug/foo
      #   working-directory: integration

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - clippy
      - build
      - cross
      - test
      - sanitizer
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly Rust with LLVM tools
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview --no-self-update
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache cargo registry and git
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-coverage-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-cargo-
      - name: Run LLVM coverage
        run: cargo +nightly llvm-cov --workspace --all-features --doctests --lcov --output-path lcov.info
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
          files: ./lcov.info
          disable_search: true
