# The checks on Linux: rustfmt, clippy, build, test, cross, sanitizer, valgrind and coverage. The
# checks on macOS are in `macos.yml`, the checks on Windows in `windows.yml`, and Miri in
# `miri.yml`.
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  workflow_dispatch:
  schedule: 
    - cron: "0 1 1 * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  nightly: nightly
  stable: stable

jobs:
  # Check formatting
  rustfmt:
    name: rustfmt
    strategy:
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Check formatting
      run: cargo fmt --all -- --check


  # Apply clippy lints
  clippy:
    name: clippy
    strategy:
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      run: cargo hack clippy --each-feature

  # Run tests on some extra platforms
  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          # - mips64-unknown-linux-gnuabi64
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
          - thumbv7em-none-eabihf
          - thumbv6m-none-eabi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build --target ${{ matrix.target }}
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          case "${{ matrix.target }}" in
            # A bare-metal target has no `std`, so it builds without the default `std` feature,
            # and with `alloc` it builds the heap storages. With `triomphe` it builds that storage
            # where pointers are atomic; on `thumbv6m-none-eabi`, where they are not, the feature
            # turns on no dependency and no storage, and the build is that of the other features.
            *-none-*)
              cargo build --target ${{ matrix.target }} --no-default-features
              cargo build --target ${{ matrix.target }} --no-default-features --features serde
              cargo build --target ${{ matrix.target }} --no-default-features --features alloc
              cargo build --target ${{ matrix.target }} --no-default-features --features alloc,serde
              cargo build --target ${{ matrix.target }} --no-default-features --features triomphe
              cargo build --target ${{ matrix.target }} --no-default-features --features alloc,triomphe
              cargo build --target ${{ matrix.target }} --no-default-features --features alloc,serde,triomphe
              ;;
            *)
              cargo build --target ${{ matrix.target }}
              ;;
          esac

  build:
    name: build
    strategy:
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Cache ~/.cargo
      uses: actions/cache@v6
      with:
        path: ~/.cargo
        key: ${{ runner.os }}-coverage-dotcargo
    # A tier turns on its own feature, the feature of an optional dependency turns on no tier of
    # this crate, a build without `std` has no `std` feature of any crate on, `std` forwards to
    # `triomphe` only where `triomphe` is on, and `triomphe` is a dependency only on a target with
    # atomic pointers. `cargo tree` lists the packages of a build of the target, this crate first,
    # each with the features that it has on, without the dev-dependencies, the build scripts and the
    # proc macros of the host, and a feature is matched as a whole item of a list.
    - name: Check what each feature turns on
      shell: bash
      run: |
        packages() {
          cargo tree -e no-dev,no-build,no-proc-macro --prefix none -f '{p} [{f}]' \
            --no-default-features --features "$1"
        }
        listing() {
          grep -E "\[([^]]*,)?($1)(,[^]]*)?\]"
        }
        for tier in std alloc; do
          lines=$(packages "$tier")
          if ! listing "$tier" <<<"${lines%%$'\n'*}"; then
            echo "::error::--features $tier does not turn on $tier of this crate"
            exit 1
          fi
        done
        for feature in serde arbitrary proptest quickcheck triomphe; do
          lines=$(packages "$feature")
          if listing 'std|alloc' <<<"${lines%%$'\n'*}"; then
            echo "::error::the feature $feature turns on a tier of this crate"
            exit 1
          fi
        done
        for features in '' alloc serde alloc,serde triomphe alloc,serde,triomphe; do
          lines=$(packages "$features")
          if listing std <<<"$lines"; then
            echo "::error::a build with the features '$features' has a std feature on"
            exit 1
          fi
        done
        lines=$(packages std,triomphe)
        if ! grep -E '^triomphe v' <<<"$lines" | listing std; then
          echo "::error::--features std,triomphe does not turn on std of triomphe"
          exit 1
        fi
        lines=$(packages std)
        if grep -E '^triomphe v' <<<"$lines"; then
          echo "::error::--features std turns on triomphe"
          exit 1
        fi
        lines=$(
          cargo tree -e no-dev,no-build,no-proc-macro --prefix none -f '{p} [{f}]' \
            --no-default-features --features triomphe --target thumbv6m-none-eabi
        )
        if grep -E '^triomphe v' <<<"$lines"; then
          echo "::error::--features triomphe turns on triomphe on a target without atomic pointers"
          exit 1
        fi
    - name: Run build
      run: cargo hack build --feature-powerset --depth 2
    # Temporary: the build of the library and of its tests, cold, at the base of the pull request
    # and at its head. The base is the first parent of the merge commit that a pull request run
    # checks out. The dependencies are built once before, so that each time is of numo alone.
    - name: Measure the build without and with the storages above 512 bits
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/measure
      run: |
        git worktree add "$RUNNER_TEMP/base" HEAD^1
        cargo build --lib --no-default-features
        cargo test --lib --no-default-features --no-run
        for tree in "$RUNNER_TEMP/base" "$GITHUB_WORKSPACE"; do
          cd "$tree"
          echo "::group::The library at $(git rev-parse --short HEAD)"
          cargo clean -p numo
          CARGO_INCREMENTAL=0 cargo build --lib --no-default-features
          echo "::endgroup::"
          echo "::group::The tests at $(git rev-parse --short HEAD)"
          cargo clean -p numo
          CARGO_INCREMENTAL=0 cargo test --lib --no-default-features --no-run
          echo "::endgroup::"
        done
  
  test:
    name: test
    strategy:
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Cache ~/.cargo
      uses: actions/cache@v6
      with:
        path: ~/.cargo
        key: ${{ runner.os }}-coverage-dotcargo
    - name: Run test
      run: cargo hack test --each-feature
    - name: Run the arithmetic tests without overflow checks and the Full tier of the integer serde and triomphe tests
      run: cargo test --release --lib --features serde,triomphe integer::arithmetic
    # A process of its own, with the features of the step before, so that nothing is built again:
    # the tests of the integers and those of the decimals each capture panics with a hook that they
    # install, and a panic that fell while the other hook was being installed would not be captured.
    - name: Run the decimal operators without overflow checks and the Full tier of the decimal float conversions
      run: cargo test --release --lib --features serde,triomphe -- decimal::tests::operators decimal::tests::floats
  
  sanitizer:
    name: sanitizer-${{ matrix.sanitizer }}
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - address
          - leak
          - memory
          - thread
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-sanitizer-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sanitizer-registry-
      - name: Install Rust
        run: rustup update $nightly && rustup default $nightly
      - name: Install rust-src
        if: matrix.sanitizer == 'memory' || matrix.sanitizer == 'thread'
        run: rustup component add rust-src
      # A build that exhausts the memory of the runner stops the runner without a message, so the
      # runner gets more swap space, and the next step keeps a record of the memory in use.
      - name: Add swap space
        run: |
          free -h
          df -h / /mnt
          sudo fallocate -l 16G /mnt/numo-swap
          sudo chmod 600 /mnt/numo-swap
          sudo mkswap /mnt/numo-swap
          sudo swapon /mnt/numo-swap
          free -h
      - name: ${{ matrix.sanitizer }} sanitizer (Linux)
        run: |
          (while sleep 30; do free -m | awk '/^Mem:/ { used = $3 } /^Swap:/ { print "memory in use: " used " MiB, swap in use: " $3 " MiB" }'; done) &
          ci/sanitizer.sh ${{ matrix.sanitizer }}

  # valgrind
  valgrind:
    name: valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-latest-valgrind-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-latest-valgrind-

      - name: Install Rust ${{ env.stable }}
        uses: actions-rs/toolchain@v1
        with:
            toolchain: ${{ env.stable }}
            override: true
      - name: Install Valgrind
        run: |
          sudo apt-get update -y
          sudo apt-get install -y valgrind
      # Compile tests
      # - name: cargo build foo
      #   run: cargo build --bin foo
      #   working-directory: integration

      # Run with valgrind
      # - name: Run valgrind foo
      #   run: valgrind --error-exitcode=1 --leak-check=full --show-leak-kinds=all ./target/debug/foo
      #   working-directory: integration

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - clippy
      - build
      - cross
      - test
      - sanitizer
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly Rust with LLVM tools
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview --no-self-update
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache cargo registry and git
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-coverage-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-coverage-cargo-
      # A build that exhausts the memory of the runner stops the runner without a message, so the
      # runner gets more swap space, and the next step keeps a record of the memory in use.
      - name: Add swap space
        run: |
          free -h
          df -h / /mnt
          sudo fallocate -l 16G /mnt/numo-swap
          sudo chmod 600 /mnt/numo-swap
          sudo mkswap /mnt/numo-swap
          sudo swapon /mnt/numo-swap
          free -h
      - name: Run LLVM coverage
        run: |
          (while sleep 30; do free -m | awk '/^Mem:/ { used = $3 } /^Swap:/ { print "memory in use: " used " MiB, swap in use: " $3 " MiB" }'; done) &
          cargo +nightly llvm-cov --workspace --all-features --doctests --lcov --output-path lcov.info
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
          files: ./lcov.info
          disable_search: true
