name: msan-debug

on:
  pull_request:
  workflow_dispatch:

jobs:
  msan-debug:
    name: msan-debug (${{ matrix.case }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: pairs-2m
            filter: integer::arithmetic::tests::every_pair_of_7_and_8_bits
            min_stack: ""
          - case: pairs-64m
            filter: integer::arithmetic::tests::every_pair_of_7_and_8_bits
            min_stack: "67108864"
          - case: all-64m
            filter: ""
            min_stack: "67108864"
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        run: rustup update nightly --no-self-update && rustup default nightly && rustup component add rust-src
      - name: Install gdb and jq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdb jq
      - name: Build the lib tests with the memory sanitizer
        env:
          RUSTFLAGS: -Z sanitizer=memory --cfg all_tests
        run: |
          cargo -Zbuild-std test --lib --target x86_64-unknown-linux-gnu --all-features --no-run --message-format=json > build.json
          bin=$(jq -r 'select(.executable != null and .target.kind == ["lib"]) | .executable' build.json | head -n 1)
          if [ -z "$bin" ]; then
            echo "no test executable found" >&2
            exit 1
          fi
          echo "$bin" > bin.txt
      - name: Run under gdb
        env:
          FILTER: ${{ matrix.filter }}
          CASE: ${{ matrix.case }}
          MIN_STACK: ${{ matrix.min_stack }}
        run: |
          bin=$(cat bin.txt)
          if [ -n "$FILTER" ]; then
            args=("$FILTER" --exact --test-threads=1)
          else
            args=()
          fi
          if [ -n "$MIN_STACK" ]; then
            export RUST_MIN_STACK="$MIN_STACK"
          fi
          echo "case: $CASE"
          echo "binary: $bin"
          echo "arguments: ${args[*]}"
          echo "RUST_MIN_STACK: ${RUST_MIN_STACK:-<unset>}"
          gdb -q -batch \
            -ex 'set pagination off' \
            -ex 'handle SIGSEGV stop print nopass' \
            -ex run \
            -ex 'bt 12' \
            -ex 'info registers rip rsp rbp' \
            -ex 'x/6i $pc' \
            -ex 'frame 0' -ex 'info frame' \
            -ex 'frame 1' -ex 'info frame' \
            -ex 'frame 2' -ex 'info frame' \
            -ex 'frame 3' -ex 'info frame' \
            -ex 'frame 4' -ex 'info frame' \
            -ex 'frame 5' -ex 'info frame' \
            -ex "x/24i 'numo::integer::arithmetic::tests::every_pair_of_7_and_8_bits'" \
            -ex 'info threads' \
            -ex 'info proc mappings' \
            --args "$bin" "${args[@]}"
