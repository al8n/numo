[package]
name = "numo"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/al8n/numo"
documentation = "https://docs.rs/numo"
description = "Exact fixed-point decimal numbers of up to 153 digits, or 154 with u512, with type-level digit counts and selectable integer storage, for no_std without allocation"
license = "MIT OR Apache-2.0"
keywords = ["decimal", "fixed-point", "exact", "typenum", "no-std"]
categories = ["mathematics", "no-std"]

[[bench]]
path = "benches/foo.rs"
name = "foo"
harness = false

[features]
default = ["std"]
alloc = []
std = ["thiserror/default"]

# Only `serde_core`, without default features: turns on no feature of any other crate in a build.
serde = ["dep:serde_core"]
# `arbitrary`, which uses `std`: generation for fuzzing on a hosted target.
arbitrary = ["dep:arbitrary"]
# `proptest` with only its `std` feature: generation and shrinking for property tests on a hosted
# target.
proptest = ["dep:proptest"]
# `quickcheck` without its default features, `regex` and `use_logging`: generation and shrinking
# for property tests on a hosted target. Its trait makes shrinking return a boxed iterator.
quickcheck = ["dep:quickcheck"]

[dependencies]
derive_more = { version = "2", default-features = false, features = ["is_variant", "display"] }
thiserror = { version = "2", default-features = false }
typenum = { version = "1.20", features = ["const-generics"] }

arbitrary = { version = "1", optional = true }
proptest = { version = "1", default-features = false, features = ["std"], optional = true }
quickcheck = { version = "1", default-features = false, optional = true }
serde_core = { version = "1", default-features = false, optional = true }


[dev-dependencies]
bigdecimal = "0.4"
criterion = "0.8"
num-bigint = "0.5"
postcard = { version = "1", features = ["use-std"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# `serde` with its derive, renamed because the crate has a feature named `serde`.
serde_full = { package = "serde", version = "1", features = ["derive"] }
serde_json = "1"
serde_test = "1"
trybuild = "1"

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
single_use_lifetimes = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
